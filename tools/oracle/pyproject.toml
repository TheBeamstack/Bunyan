[project]
name = "bunyan-oracle"
version = "0.1.0"
description = "Offline golden-value seeding for Bunyan's geometry harness. NEVER runs in CI (spec §9)."
requires-python = ">=3.12,<3.13"
dependencies = [
    # OCP = the CadQuery/OCP Python bindings to a native OpenCascade build.
    #
    # `pythonocc-core` (named in the original plan) is NOT installable from PyPI — its PyPI entry
    # is an abandoned 0.16 placeholder and the real 7.9.x releases are conda-only; this box uses
    # uv, not conda. `cadquery-ocp` wraps the same OCCT 7.9. Owner-approved 2026-07-11; the spec
    # (§2) and the plan (P1 step 2) now name cadquery-ocp.
    "cadquery-ocp==7.9.3.1.1",
]

[project.scripts]
seed-goldens = "bunyan_oracle.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bunyan_oracle"]
