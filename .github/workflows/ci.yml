name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · geometry harness
    # Self-hosted while the repo is private (owner ruling, 2026-08-15): GitHub-hosted minutes ran out
    # and going public to get the public-repo free tier is blocked on the CLA counterparty (Q11).
    runs-on: [self-hosted, bunyan-oracle]
    steps:
      # ⚠⚠ `fetch-depth: 0` IS LOAD-BEARING, AND ITS ABSENCE WAS INVISIBLE FOR 73 ENTRIES.
      # `actions/checkout` defaults to a SHALLOW clone (depth 1), which contains the merge commit and
      # nothing else — so the Re-seed gate's `git diff <base>...<head>` below dies with
      # `fatal: Invalid symmetric difference expression`, and the whole job fails RED for a reason
      # that has nothing to do with the diff being gated.
      #
      # It never surfaced because this repository had NO pull request until 2026-08-01 (PR #1):
      # on a `push` the gate reads no `BASE_REF` and prints *"not a pull request — skipping"*, which
      # is the only path it had ever taken. **The gate whose comment says it exists so the check is
      # "impossible to quietly skip" had itself never executed once.** (§1c-7: a step believed to
      # work because nothing ever ran it — the disease's fifth recorded occurrence.)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (strict)
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Runs the WASM build only — pythonocc/OCP is NEVER in CI (spec §9, decision D6/D9).
      # The goldens it checks against are committed, seeded offline on the pinned environment.
      - name: Geometry harness (golden + invariant + regression snapshot)
        run: pnpm test

      # The re-seed gate (spec §9): a changed `buildGeometry` MUST ship re-seeded goldens.
      # Scaffolded here so it is impossible to add geometry later and quietly skip the gate.
      - name: Re-seed gate
        run: node scripts/check-reseed.mjs
        # ⚠ Unchanged by entry 88. This gate diffs `base...head` (THREE dots, a merge-base diff), for
        # which `github.sha` — the merge commit on a pull_request — gives the right answer. The
        # prompt-sync gate below needs the PR's real head instead, and says why there.
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.sha }}

      # GATE 6 — the handoff docs (added 2026-07-31, `docs/design/handoff_system_design.md`).
      #
      # Two things, both of which used to be enforced by an agent remembering:
      #   * the doc BUDGET + the eight-field entry-abstract schema + §8 freshness. The old rotation
      #     rule was a COUNT while entry sizes doubled underneath it, and it failed measurably —
      #     a compaction took current_state.md 377 KB -> 296 KB and it was back to 393 KB the SAME DAY.
      #   * the FROZEN SURFACE. A diff against tests/frozen-surface.snapshot.json means the PR is
      #     `RISK: contract-touching`, so the OWNER merges it rather than the reviewing agent — and
      #     after the P5 freeze, re-baselining that file requires an owner ruling. That policy IS
      #     the freeze, and this step is what holds it.
      #
      # ⚠ `pnpm verify` runs this too: a local gate that is a strict SUBSET of CI is a
      #   false-negative generator, and this repo has been bitten by exactly that.
      #
      # ⚠ RENAMED AT ENTRY 91. `docs:check` also runs `tests/protocol/` now — the seat registry, the
      # machine gate, dependency closure, the claim/finish scripts and the two gates below. That was
      # true the moment `package.json`'s `docs:check` grew the path; the step name saying otherwise is
      # how a suite ends up running for months while everyone believes it needs wiring.
      - name: Handoff docs + freeze boundary + seat protocol
        run: pnpm docs:check
        # ⚠⚠ THE PROMPT-SYNC GATE NEEDS THE BASE SHA, AND FOR ENTRY 73's REASON.
        # `tests/prompt-sync.test.ts` asserts that `Zayd_Prompt.md` on the branch is byte-identical to
        # main's once loop step 10(a) has pushed it — the invariant `pnpm state` silently breaks, which
        # GitHub then reports as the unrecognisable "Pull Request has merge conflicts".
        #
        # It reads the same `pull_request.base.sha` the re-seed gate reads, rather than `origin/main`.
        # ⚠ MEASURED since: `origin/main` DOES exist here — checkout fetches
        # `+refs/heads/*:refs/remotes/origin/*` under `fetch-depth: 0`. The SHA is still preferred,
        # because it needs no ref to exist at all, and a gate resting on an unmeasured property of this
        # checkout is precisely how the re-seed gate above never executed for 73 entries.
        # Absent (a `push` to main), the gate skips.
        #
        # ⚠⚠ `HEAD_REF` IS `pull_request.head.sha`, **NOT** `github.sha`. On a pull_request the checked-out
        # HEAD is `refs/pull/N/merge` — a merge commit that CONTAINS main — so the gate's "no conflict is
        # possible" skip would fire on every PR and the check would be green and useless. Measured on its
        # own first CI run: `HEAD is now at 7fd391f Merge 4a9cd10 into b96c3a3`.
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}

  # ─────────────────────────────────────────────────────────────────────────────────────────────
  # PR SHAPE + RESERVED-CLASS ROUTING (Entry 91, D82).
  #
  # A SEPARATE JOB, and for two reasons rather than tidiness:
  #   * it needs `pull-requests: write` to label, and the verify job must NOT carry a write token
  #     just to run tests;
  #   * it is meaningless on a `push` to main — there is no PR to shape-check or label — so it is
  #     gated on the event instead of skipping itself halfway through.
  #
  # ⚠ NO `pnpm install`. Both scripts import only Node builtins plus this repo's own `scripts/*.mjs`.
  # A job that installs a workspace to run two files is a job that goes red when a dependency does.
  # ─────────────────────────────────────────────────────────────────────────────────────────────
  pr-shape:
    name: PR shape · reserved classes
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, bunyan-oracle]
    permissions:
      contents: read
      pull-requests: write
    steps:
      # ⚠⚠ `fetch-depth: 0` IS LOAD-BEARING HERE TOO, for the same reason it is above: the reserved
      # class scan reads the frozen-surface baseline out of the BASE ref (`git show <base>:…`), which
      # a depth-1 clone does not contain. Its absence would not fail loudly — `git show` would come
      # back empty, the scan would fall back to the working-tree baseline, and it would measure the
      # surface against a file this very PR may have rewritten. That is Q15's defect, reincarnated in
      # a new script, and it would report `additive` on exactly the PRs that must not be.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The title must route (`T-nnn: ` / `STEWARD: `) and GitHub must report the PR MERGEABLE.
      # `agent-finish.mjs` already refuses to PRINT a non-routing title — this asks the PR that
      # actually got opened, because `--fill`, a hand-typed title and `gh pr edit --title` all reach
      # GitHub without passing through that script.
      - name: PR title routes · mergeable
        run: node scripts/pr-ready.mjs --pr "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The three owner-gated classes of AGENTS.md §5, decided mechanically and written on as
      # `needs-operator/*` labels. It does not block — the owner merges these, and a red check on the
      # owner's own PR is noise they learn to click past. It DOES fail if it cannot apply the label
      # it decided on: a labeller that silently no-ops is indistinguishable from an additive PR.
      #
      # ⚠ `--base` is `pull_request.base.sha`, matching the re-seed gate above. The checked-out HEAD
      # on a pull_request is the MERGE RESULT, which is the right tree to measure.
      - name: Reserved-class labelling
        run: |
          node scripts/reserved-classes.mjs \
            --base "${{ github.event.pull_request.base.sha }}" \
            --pr "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
